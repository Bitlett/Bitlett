<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Bitlet</title>
		<link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">

		<link rel="stylesheet" href="styles.css">
	</head>

	<body>
		<img class="background" src="https://media.hsmusic.wiki/album-art/bittersweet/cover.png">

		<main class="content">
			<img class="logo" alt="Bitlet" src="assets/images/branding/username.png">

			<nav class="socials">
				<a class="pill pill--twitter" href="https://twitter.com/Bitlet_">
					<img class="pill__icon" src="assets/icons/twitter.svg" alt="">
					<span class="pill__label">Twitter</span>
					<span class="pill__arrow">→</span>
				</a>
				<a class="pill pill--faceit" href="https://www.faceit.com/en/players/Bitlet">
					<img class="pill__icon" src="assets/icons/faceit.svg" alt="">
					<span class="pill__label">FaceIt</span>
					<span class="pill__arrow">→</span>
				</a>
				<a class="pill pill--github" href="https://github.com/Bitlett">
					<img class="pill__icon" src="assets/icons/github.svg" alt="">
					<span class="pill__label">GitHub</span>
					<span class="pill__arrow">→</span>
				</a>
			</nav>
		</main>
	</body>
</html>
