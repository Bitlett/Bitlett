<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Bitlet</title>
		<link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">

		<link rel="stylesheet" href="styles.css">
	</head>

	<body>
		<img class="background" src="https://media.hsmusic.wiki/album-art/bittersweet/cover.png">

		<main class="content">
			<img class="logo" alt="Bitlet" src="assets/images/branding/username.png">
			<i class="bi bi-link"></i>
			<nav class="socials">
				<button type="button" class="pill pill--discord" data-copy="bitlet" aria-label="Copy Discord username">
					<img class="pill__logo-icon" src="assets/icons/logos/discord.svg" alt="">
					<span class="pill__label">Discord</span>
					<img class="pill__action-icon" src="assets/icons/clipboard2.svg">
					<script src="js/pill-discord.js"></script>
				</button>
				<a class="pill pill--faceit" href="https://www.faceit.com/en/players/Bitlet" target="_blank">
					<img class="pill__logo-icon" src="assets/icons/logos/faceit.svg" alt="">
					<span class="pill__label">FaceIt</span>
					<img class="pill__action-icon" src="assets/icons/box-arrow-up-right.svg">
				</a>
				<a class="pill pill--github" href="https://github.com/Bitlett" target="_blank">
					<img class="pill__logo-icon" src="assets/icons/logos/github.svg" alt="">
					<span class="pill__label">GitHub</span>
					<img class="pill__action-icon" src="assets/icons/box-arrow-up-right.svg">
				</a>
			</nav>
		</main>
	</body>
</html>
